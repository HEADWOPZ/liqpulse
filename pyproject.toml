[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liqpulse"
version = "0.1.0"
description = "Paper-first liquidation and carry loop monitor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kevin Lance Murray" }]
keywords = ["perps", "funding", "liquidation", "carry", "paper-trading"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
liqpulse = "liqpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liqpulse = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "network: hits a public venue; skipped in CI and when LIQPULSE_FEED=mock",
]
